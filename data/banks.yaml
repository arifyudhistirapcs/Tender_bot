# Daftar bank yang dipantau Tender Bot.
#
# Sumber isi: kerja/riset/riset-eproc-bank-edc.md (diakses 23 Oktober 2026).
# Aturan pengisian:
#   - access dan sources HANYA dari laporan riset. Bank yang tidak diriset
#     diberi access: not_found tanpa sources.
#   - URL tidak boleh dikarang. Subdomain "tebakan" di laporan yang gagal
#     koneksi TIDAK dimasukkan sebagai source.
#   - aliases = nama lengkap untuk kueri berita (akronim bank bertabrakan).
#
# Field per bank:
#   name    : nama ringkas (dipakai di laporan & fingerprint)
#   aliases : daftar nama/istilah untuk kueri berita Google News
#   group   : bumn | swasta | bpd
#   access  : public | vendor_login | not_found | blocked
#   needs_js: true bila situs/portal dirender JavaScript. Kolektor light
#             MELEWATI sumber/bank needs_js dan mencatatnya di coverage
#             sebagai "butuh browser, dicek di mode full". (opsional, default false)
#   vendor_registration_url: URL pendaftaran vendor (opsional, boleh kosong;
#             diisi agen riset lain nanti)
#   sources : daftar {url, type: rss|html|pdf_list, needs_js?}; kosong bila tak ada
#   notes   : catatan akses dari riset

banks:
  # ======================= BANK BUMN =======================
  - name: BRI
    aliases: ["Bank Rakyat Indonesia", "BRI", "BBRI"]
    group: bumn
    access: vendor_login
    vendor_registration_url: "https://tdronline.bri.co.id/"
    vendor_registration_note: "Daftar akun di tdronline, lalu login di eproc.bri.co.id (dilindungi Incapsula)."
    sources: []
    notes: >-
      Portal eproc.bri.co.id wajib login vendor; diblokir WAF Incapsula saat
      dicek HTTP biasa. Pantau lewat berita. Kasus KPK pengadaan mesin EDC
      BRI 2020-2024.

  - name: Bank Mandiri
    aliases: ["Bank Mandiri", "Bank Mandiri Persero"]
    group: bumn
    access: not_found
    sources: []
    notes: >-
      Portal e-procurement tidak ditemukan (subdomain tebakan gagal koneksi).
      Pantau lewat berita.

  - name: BNI
    aliases: ["Bank Negara Indonesia", "BBNI"]
    group: bumn
    access: not_found
    vendor_registration_url: "https://e-proc.bni.co.id/"
    vendor_registration_note: "Portal e-proc.bni.co.id; saat dicek menjawab HTTP 503, konfirmasi ke bank."
    sources: []
    notes: >-
      Portal tidak ditemukan. Akronim "BNI" bertabrakan dengan Business
      Network International; pakai nama lengkap. Pantau lewat berita.

  - name: BTN
    aliases: ["Bank Tabungan Negara", "BBTN"]
    group: bumn
    access: public
    vendor_registration_url: "https://e2eprocreg.btn.co.id/"
    vendor_registration_note: "Registrasi Oracle EBS. Helpdesk WA +62 822 5888 2676."
    sources:
      - url: "https://www.btn.co.id/en/Procurement/Procurement-List"
        type: html
        needs_js: true
    notes: >-
      Procurement List publik dibuka browser pada 9 November 2026 (26 judul,
      25 tanggal). Fetcher menerima resource Incapsula, jadi mode light
      menunggu inbox browser. Registrasi Oracle EBS tetap terpisah untuk vendor.

  - name: BSI
    aliases: ["Bank Syariah Indonesia", "BRIS"]
    group: bumn
    access: public
    vendor_registration_url: "https://rekanan.bankbsi.co.id/"
    vendor_registration_note: "Portal rekanan.bankbsi.co.id; fungsi disimpulkan dari nama alamat, konfirmasi ke bank."
    sources:
      - url: "https://www.bankbsi.co.id/news-update/info-nasabah?category=informasi-pengadaan-lelang"
        type: html
        needs_js: true
    notes: >-
      Halaman Informasi Pengadaan/Lelang publik dibuka browser pada 9 November
      2026. Fetcher tertahan Incapsula, jadi mode light menunggu inbox browser.
      Contoh terakhir yang terbaca bertanggal 30 Oktober 2026.

