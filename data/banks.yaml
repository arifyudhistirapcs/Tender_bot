        type: html
    notes: >-
      Daftar tender publik WordPress; tiap pengumuman post jasa_barang.
      /feed/ menjawab RSS (feed seluruh situs). Arsip HTML server-side,
      pola URL /jasa_barang/<slug>/. Rincian ada di lampiran unduhan.
      Sedang menayangkan tender Sewa Beli Mesin Smart EDC (13 Okt 2026).

