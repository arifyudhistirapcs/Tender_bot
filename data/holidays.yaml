#   mengikuti sidang isbat/penetapan pemerintah. Tanggal cuti bersama juga
#   kadang direvisi. Yang ditandai "uncertain: true" perlu diperiksa ulang
#   terhadap SKB resmi sebelum tahun berjalan.
#   Melewatkan satu hari ekstra sekadar berarti bot tidak kirim; tidak merusak.

