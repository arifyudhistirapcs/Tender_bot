[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderbot"
version = "0.1.0"
description = "Pemantau tender EDC bank Indonesia (mode light deterministik)."
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "PyYAML==6.0.2",
    "pypdf==6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
